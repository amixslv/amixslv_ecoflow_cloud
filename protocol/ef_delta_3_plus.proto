//  lai mainītu konfigurāciju, iestatījumus un režīmus.
//  Visi lauki saglabāti no Delta3, pievienoti Delta3 Plus lauki.
//
message Delta3PlusSetCommand {

    optional int32 cfg_power_off = 3;                 // Izslēgt ierīci (1 = power off)
    optional uint32 cfg_utc_time = 6;                 // UTC timestamp (sekundēs)
    optional int32 cfg_utc_timezone = 7;              // Laika joslas nobīde (minūtēs)

    optional int32 en_beep = 9;                       // Skaņas signāls (0/1)
    optional int32 ac_standby_time = 10;              // AC standby timeout (min)
    optional int32 dc_standby_time = 11;              // DC standby timeout (min)
    optional int32 screen_off_time = 12;              // Ekrāna izslēgšanās laiks (sek)
    optional int32 dev_standby_time = 13;             // Ierīces standby timeout (min)

    optional int32 lcd_light = 14;                    // LCD spilgtums (0–100)

    optional int32 cfg_dc12v_out_open = 18;           // 12V DC izvade (0/1)

    optional int32 xboost_en = 25;                    // X‑Boost režīms (0/1)

    optional int32 cms_max_chg_soc = 33;              // Max uzlādes SOC (%)
    optional int32 cms_min_dsg_soc = 34;              // Min izlādes SOC (%)

    optional Delta3PlusCfgEnergyBackup cfg_energy_backup = 43;  
        // Rezerves enerģijas konfigurācija:
        //   energy_backup_en (0/1)
        //   energy_backup_start_soc (%)

    optional int32 plug_in_info_ac_in_chg_pow_max = 54; // Max AC uzlādes jauda (W)
    optional int32 plug_in_info_5p8_chg_pow_max = 56;   // Papildus porta max uzlādes jauda (W)
    optional int32 cms_oil_self_start = 58;             // Self-powered (0/1)
    optional int32 cms_oil_on_soc = 59;                 // Self-powered start SOC (%)
    optional int32 cms_oil_off_soc = 60;                // Self-powered stop SOC (%)
    optional int32 llc_gfci_flag = 61;                  // AC drošības/GFCI režīms
    optional int32 ac_energy_saving_open = 99;          // AC energy-saving režīms (0/1)
    optional int32 multi_bp_chg_dsg_mode = 100;         // Multi battery charge/discharge mode
    optional int32 low_discharge_limit_cmd = 102;       // Zema izlādes limita komanda (%)

    optional uint32 cfg_ac_out_open = 76;             // AC izvade ieslēgta (0/1)

    optional uint32 plug_in_info_pv_dc_amp_max = 87;  // Max PV uzlādes strāva (A)

    optional uint32 cfg_led_mode = 89;                // LED režīms (0–n)

    optional uint32 pv_chg_type = 90;                 // PV uzlādes tips:
                                                      //   0 = Auto
                                                      //   1 = Car
                                                      //   2 = Solar/Car
                                                      //   3 = Solar
                                                      //   4 = ExtraBattery/Generator port
                                                      //   5 = DCP
                                                      //   6 = DCP2
                                                      //   7 = AC Charger
                                                      //   8 = MPPT Only
                                                      //   9 = DC High Voltage

    optional int32 output_power_off_memory = 141;     // Power‑off memory (0/1)
}
//
//  DELTA 3 PLUS — SET REPLY
//  (cmdFunc = 254, cmdId = 18)
//  Ierīces atbilde uz SetCommand.
//  Satur gan apstiprinājumu, gan atjauninātos iestatījumus.
//
message Delta3PlusSetReply {

    optional int32 action_id = 1;                     // Darbības ID (atkārto SetCommand)
    optional bool config_ok = 2;                      // Vai konfigurācija veiksmīga (true/false)

    optional uint32 cfg_utc_time = 6;                 // UTC timestamp (sekundēs)
    optional int32 cfg_utc_timezone = 7;              // Laika joslas nobīde (min)

    optional int32 en_beep = 9;                       // Skaņas signāls (0/1)
    optional int32 ac_standby_time = 10;              // AC standby timeout (min)
    optional int32 dc_standby_time = 11;              // DC standby timeout (min)
    optional int32 screen_off_time = 12;              // Ekrāna izslēgšanās laiks (sek)
    optional int32 dev_standby_time = 13;             // Ierīces standby timeout (min)

    optional int32 lcd_light = 14;                    // LCD spilgtums (0–100)

    optional int32 cfg_dc12v_out_open = 18;           // 12V DC izvade (0/1)

    optional int32 xboost_en = 25;                    // X‑Boost režīms (0/1/2/3/4)

    optional int32 cms_max_chg_soc = 33;              // Max uzlādes SOC (%)
    optional int32 cms_min_dsg_soc = 34;              // Min izlādes SOC (%)

    optional Delta3PlusCfgEnergyBackup cfg_energy_backup = 43;
        // Rezerves enerģijas konfigurācija:
        //   energy_backup_en (0/1)
        //   energy_backup_start_soc (%)

    optional int32 plug_in_info_ac_in_chg_pow_max = 54; // Max AC uzlādes jauda (W)
    optional int32 plug_in_info_5p8_chg_pow_max = 56;   // Papildus porta max uzlādes jauda (W)
    optional int32 cms_oil_self_start = 58;             // Self-powered (0/1)
    optional int32 cms_oil_on_soc = 59;                 // Self-powered start SOC (%)
    optional int32 cms_oil_off_soc = 60;                // Self-powered stop SOC (%)
    optional int32 llc_gfci_flag = 61;                  // AC drošības/GFCI režīms
    optional int32 ac_energy_saving_open = 99;          // AC energy-saving režīms (0/1)
    optional int32 multi_bp_chg_dsg_mode = 100;         // Multi battery charge/discharge mode
    optional int32 low_discharge_limit_cmd = 102;       // Zema izlādes limita komanda (%)

    optional uint32 dc_out_open = 74;                 // DC izvade ieslēgta (0/1)
    optional uint32 cfg_ac_out_open = 76;             // AC izvade ieslēgta (0/1)

    optional uint32 plug_in_info_pv_dc_amp_max = 87;  // Max PV uzlādes strāva (A)

    optional uint32 cfg_led_mode = 89;                // LED režīms (0–7)

    optional uint32 pv_chg_type = 90;                 // PV uzlādes tips:
                                                      //   0 = Auto
                                                      //   1 = Car
                                                      //   2 = Solar/Car
                                                      //   3 = Solar
                                                      //   4 = ExtraBattery/Generator
                                                      //   5 = DCP
                                                      //   6 = DCP2
                                                      //   7 = AC Charger
                                                      //   8 = MPPT Only
                                                      //   9 = DC High Voltage
                                                      //   10 = Smart Generator
                                                      //   11 = Smart Alternator
                                                      //   12 = Regulated DC
                                                      //   13 = Unregulated DC
                                                      //   14 = USB‑C PD
                                                      //   15 = USB‑C PPS
                                                      //   16 = Reserved

    optional int32 output_power_off_memory = 141;     // Power‑off memory (0/1)
}

message Delta3PlusCfgEnergyBackup {
  optional uint32 energy_backup_en = 1;
  optional uint32 energy_backup_start_soc = 2;
}

//
//  DELTA 3 PLUS — CMS HEARTBEAT REPORT
//  (cmdFunc = 32, cmdId = 2)
//  CMS = Cell Management System.
//  Šis ziņojums tiek sūtīts ļoti bieži (ik ~1 sekundi),
//  un satur apvienoto BMS/CMS stāvokli.
//
message Delta3PlusCMSHeartBeatReport {
  optional Delta3PlusCMSStatus1 msg32_2_1 = 1;   // CMS statusa bloks 1
  optional Delta3PlusCMSStatus2 msg32_2_2 = 2;   // CMS statusa bloks 2
}
//
//  DELTA 3 PLUS — CMS STATUS 1
//  Galvenie CMS parametri: SOC, spriegumi, laiki, stāvokļi.
//
message Delta3PlusCMSStatus1 {

  optional sint32 cms_status_misc1 = 1;          // Iekšējais CMS statuss (nenorādīts)
  optional sint32 cms_status_misc2 = 2;          // Rezervēts / nenorādīts
  optional sint32 cms_status_misc3 = 3;          // Rezervēts / nenorādīts

  optional sint32 cms_batt_vol_mv = 4;           // Akumulatora spriegums (mV)
  optional uint32 cms_chg_req_amp = 5;           // Pieprasītā uzlādes strāva (mA)

  optional sint32 cms_status_misc4 = 6;          // Rezervēts / nenorādīts

  optional uint32 cms_max_chg_soc = 7;           // Max SOC iestatījums (%)
  optional uint32 cms_min_dsg_soc = 8;           // Min SOC iestatījums (%)

  optional uint32 ac_out_freq = 9;               // AC izvades frekvence (Hz)

  optional sint32 cms_status_misc5 = 10;         // Rezervēts
  optional sint32 cms_status_misc6 = 11;         // Rezervēts

  optional uint32 cms_chg_rem_time = 12;         // Atlikušais uzlādes laiks (min)
  optional uint32 cms_dsg_rem_time = 13;         // Atlikušais izlādes laiks (min)

  optional sint32 cms_chg_dsg_state = 14;        // Uzlādes/izlādes stāvoklis:
                                                 //   0 = Idle
                                                 //   1 = Discharging
                                                 //   2 = Charging
                                                 //   3 = Balancing
                                                 //   4 = Sleep
                                                 //   5 = Error
                                                 //   6 = Pre‑Charge
                                                 //   7 = Pre‑Discharge

  optional float cms_batt_soc = 15;              // Kombinētais SOC (%)

  repeated sint32 bms_is_conn_state = 16;        // BMS moduļu savienojuma stāvokļi:
                                                 //   0 = Nav savienots
                                                 //   1 = Savienots
                                                 //   2 = Kļūda
                                                 //   3 = Booting
                                                 //   4 = Updating

  optional sint32 cms_status_misc7 = 17;         // Rezervēts
  optional sint32 cms_status_misc8 = 18;         // Rezervēts
  optional sint32 cms_status_misc9 = 19;         // Rezervēts
  optional sint32 cms_status_misc10 = 20;        // Rezervēts
  optional sint32 cms_status_misc11 = 21;        // Rezervēts
  optional sint32 cms_status_misc12 = 22;        // Rezervēts

  optional uint32 cms_oil_off_soc = 23;          // SOC, pie kura ģenerators izslēdzas
                                                 // (Smart Generator integrācija)
}
//
//  DELTA 3 PLUS — CMS STATUS 2
//  Papildu CMS statusa lauki (reti izmantoti).
//
message Delta3PlusCMSStatus2 {
  optional sint32 cms_status_misc13 = 1;         // Rezervēts / nenorādīts
  optional sint32 cms_status_misc14 = 2;         // Rezervēts
  optional sint32 cms_status_misc15 = 3;         // Rezervēts
  optional sint32 cms_status_misc16 = 4;         // Rezervēts
  optional sint32 cms_status_misc17 = 5;         // Rezervēts
}
//
//  DELTA 3 PLUS — BMS HEARTBEAT REPORT
//  (cmdFunc = 32, cmdId = 3)
//  Pilns akumulatora BMS statuss. Sūtās regulāri (ik 1–2 sek).
//  Satur šūnu spriegumus, temperatūras, kļūdas, kapacitāti,
//  balansēšanu, MOS stāvokļus, enerģijas uzskaiti un BMS versijas.
//
message Delta3PlusBMSHeartBeatReport {

  optional uint32 num = 1;                 // Baterijas modulis (0 = iekšējais, 1..n = papildu)
  optional uint32 type = 2;                // Baterijas tips (modelis)
  optional uint32 cell_id = 3;             // Šūnas ID (iekšējai diagnostikai)

  optional uint32 err_code = 4;            // BMS kļūdas kods (bitmask)
  optional uint32 sys_ver = 5;             // Sistēmas firmware versija

  optional uint32 soc = 6;                 // SOC (%)
  optional uint32 vol = 7;                 // Kopējais spriegums (mV)
  optional int32 amp = 8;                  // Strāva (mA, negatīva = izlāde)
  optional int32 temp = 9;                 // Baterijas temperatūra (°C)

  optional uint32 open_bms_flag = 10;      // BMS atvērts / aizvērts (0/1)

  optional uint32 design_cap = 11;         // Dizaina kapacitāte (mAh)
  optional uint32 remain_cap = 12;         // Atlikusī kapacitāte (mAh)
  optional uint32 full_cap = 13;           // Pilnā kapacitāte (mAh)

  optional uint32 cycles = 14;             // Ciklu skaits
  optional uint32 soh = 15;                // SOH (%)

  optional uint32 max_cell_vol = 16;       // Max šūnas spriegums (mV)
  optional uint32 min_cell_vol = 17;       // Min šūnas spriegums (mV)

  optional int32 max_cell_temp = 18;       // Max šūnas temperatūra (°C)
  optional int32 min_cell_temp = 19;       // Min šūnas temperatūra (°C)

  optional int32 max_mos_temp = 20;        // Max MOSFET temperatūra (°C)
  optional int32 min_mos_temp = 21;        // Min MOSFET temperatūra (°C)

  optional uint32 bms_fault = 22;          // BMS kļūdu bitmask (paplašināts)
  optional uint32 bq_sys_stat_reg = 23;    // BQ čipa statuss (iekšējais)

  optional uint32 tag_chg_amp = 24;        // Mērķa uzlādes strāva (mA)
  optional float f32_show_soc = 25;        // SOC, ko rāda displejs (%)

  optional uint32 input_watts = 26;        // Ievades jauda (W)
  optional uint32 output_watts = 27;       // Izvades jauda (W)

  optional uint32 remain_time = 28;        // Atlikušais laiks (min)
  optional uint32 mos_state = 29;          // MOSFET stāvoklis (bitmask)
  optional uint32 balance_state = 30;      // Balansēšanas stāvoklis (bitmask)

  optional uint32 max_vol_diff = 31;       // Max sprieguma starpība starp šūnām (mV)

  optional uint32 cell_series_num = 32;    // Šūnu skaits sērijā
  repeated uint32 cell_vol = 33;           // Individuālie šūnu spriegumi (mV)

  optional uint32 cell_ntc_num = 34;       // Šūnu temperatūras sensoru skaits
  repeated int32 cell_temp = 35;           // Individuālās šūnu temperatūras (°C)

  optional string hw_ver = 36;             // BMS hardware versija
  optional uint32 bms_heartbeat_ver = 37;  // Heartbeat protokola versija

  optional uint32 ecloud_ocv = 38;         // OCV vērtība (EcoFlow algoritms)
  optional string bms_sn = 39;             // BMS sērijas numurs

  optional uint32 product_type = 40;       // Produkta tips
  optional uint32 product_detail = 41;     // Produkta detalizēts tips

  optional float act_soc = 42;             // Faktiskais SOC (%)
  optional float diff_soc = 43;            // SOC starpība starp algoritmiem (%)
  optional float target_soc = 44;          // Mērķa SOC (%)

  optional uint32 sys_loader_ver = 45;     // Bootloader versija
  optional uint32 sys_state = 46;          // Sistēmas stāvoklis (FSM)

  optional uint32 chg_dsg_state = 47;      // Uzlādes/izlādes stāvoklis (0–7)
  optional uint32 all_err_code = 48;       // Apvienotais kļūdu kods
  optional uint32 all_bms_fault = 49;      // Apvienotais BMS fault bitmask

  optional uint32 accu_chg_cap = 50;       // Uzkrātā uzlādes kapacitāte (mAh)
  optional uint32 accu_dsg_cap = 51;       // Uzkrātā izlādes kapacitāte (mAh)

  optional float real_soh = 52;            // Reālais SOH (%)
  optional float calendar_soh = 53;        // Kalendārais SOH (%)
  optional float cycle_soh = 54;           // Ciklu SOH (%)

  optional uint32 mos_ntc_num = 55;        // MOSFET temperatūras sensoru skaits
  repeated int32 mos_temp = 56;            // MOSFET temperatūras (°C)

  optional uint32 env_ntc_num = 57;        // Vides temperatūras sensoru skaits
  repeated int32 env_temp = 58;            // Vides temperatūras (°C)

  optional uint32 heatfilm_ntc_num = 59;   // Heatfilm sensoru skaits
  repeated int32 heatfilm_temp = 60;       // Heatfilm temperatūras (°C)

  optional uint32 cur_sensor_ntc_num = 61; // Strāvas sensoru NTC skaits
  repeated int32 cur_sensor_temp = 62;     // Strāvas sensoru temperatūras (°C)

  optional int32 max_env_temp = 63;        // Max vides temperatūra (°C)
  optional int32 min_env_temp = 64;        // Min vides temperatūra (°C)

  optional int32 max_heatfilm_temp = 65;   // Max heatfilm temperatūra (°C)
  optional int32 min_heatfilm_temp = 66;   // Min heatfilm temperatūra (°C)

  optional int32 max_cur_sensor_temp = 67; // Max strāvas sensora temperatūra (°C)
  optional int32 min_cur_sensor_temp = 68; // Min strāvas sensora temperatūra (°C)

  optional uint32 balance_cmd = 69;        // Balansēšanas komanda (iekšējā)
  repeated uint32 remain_balance_time = 70;// Atlikušais balansēšanas laiks (sek)

  optional uint32 afe_sys_status = 71;     // AFE sistēmas statuss
  optional uint32 mcu_pin_in_status = 72;  // MCU ieeju stāvoklis (bitmask)
  optional uint32 mcu_pin_out_status = 73; // MCU izeju stāvoklis (bitmask)

  optional uint32 bms_alarm_state1 = 74;   // BMS trauksmes stāvoklis 1
  optional uint32 bms_alarm_state2 = 75;   // BMS trauksmes stāvoklis 2

  optional uint32 bms_protect_state1 = 76; // BMS aizsardzības stāvoklis 1
  optional uint32 bms_protect_state2 = 77; // BMS aizsardzības stāvoklis 2

  optional uint32 bms_fault_state = 78;    // BMS fault state (paplašināts)

  optional uint32 accu_chg_energy = 79;    // Uzkrātā uzlādes enerģija (Wh)
  optional uint32 accu_dsg_energy = 80;    // Uzkrātā izlādes enerģija (Wh)

  optional string pack_sn = 81;            // Akumulatora pakas sērijas numurs

  optional uint32 water_in_flag = 82;      // Ūdens detektēts (0/1)
}
