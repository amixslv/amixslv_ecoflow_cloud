syntax = "proto3";

package amixslv.ecoflow.delta3plus;

//
//  DELTA 3 PLUS — HEADER STRUCTURES
//

// ─────────────────────────────────────────────────────────────
//  Delta3PlusHeader
// ─────────────────────────────────────────────────────────────
message Delta3PlusHeader
{
  optional bytes pdata = 1;          // Iekapsulētais binārais payload
  optional int32 src = 2;            // Avota modulis
  optional int32 dest = 3;           // Mērķa modulis
  optional int32 d_src = 4;          // Detalizēts avota ID
  optional int32 d_dest = 5;         // Detalizēts mērķa ID
  optional int32 enc_type = 6;       // Šifrēšanas tips
  optional int32 check_type = 7;     // Kontroles summas tips
  optional int32 cmd_func = 8;       // Komandas funkcijas ID
  optional int32 cmd_id = 9;         // Komandas ID
  optional int32 data_len = 10;      // Datu garums
  optional int32 need_ack = 11;      // Vai nepieciešams ACK
  optional int32 is_ack = 12;        // Vai šis ir ACK
  optional int32 seq = 14;           // Sekvences numurs
  optional int32 product_id = 15;    // Produkta ID
  optional int32 version = 16;       // Protokola versija
  optional int32 payload_ver = 17;   // Payload versija
  optional int32 time_snap = 18;     // Laika zīmogs
  optional int32 is_rw_cmd = 19;     // Read/Write komanda
  optional int32 is_queue = 20;      // Vai komanda rindā
  optional int32 ack_type = 21;      // ACK tips
  optional string code = 22;         // Kods (string)
  optional string from = 23;         // Avota identifikators
  optional string module_sn = 24;    // Moduļa sērijas numurs
  optional string device_sn = 25;    // Ierīces sērijas numurs
}

// ─────────────────────────────────────────────────────────────
//  Delta3PlusSendHeaderMsg
// ─────────────────────────────────────────────────────────────
message Delta3PlusSendHeaderMsg
{
  repeated Delta3PlusHeader msg = 1;   // Saraksts ar header ziņojumiem
}

// ─────────────────────────────────────────────────────────────
//  Delta3PlusHeaderMessage
// ─────────────────────────────────────────────────────────────
message Delta3PlusHeaderMessage
{
  repeated Delta3PlusHeader header = 1; // Header masīvs
}

// -----------------------------------------------------------------
// Time task / TOU structures (ņemts no DP3 iobroker mapējuma)
// -----------------------------------------------------------------
enum Delta3PlusTimeTaskMode {
  DELTA3_PLUS_TIME_TASK_MODE_RESV = 0;
  DELTA3_PLUS_TIME_TASK_MODE_PER_WEEK = 1;
  DELTA3_PLUS_TIME_TASK_MODE_ONCE = 2;
}

enum Delta3PlusTimeTaskType {
  DELTA3_PLUS_TIME_TASK_TYPE_AC_CHG = 0;
  DELTA3_PLUS_TIME_TASK_TYPE_AC_DSG = 1;
  DELTA3_PLUS_TIME_TASK_TYPE_AC2_DSG = 2;
  DELTA3_PLUS_TIME_TASK_TYPE_DC_CHG = 3;
  DELTA3_PLUS_TIME_TASK_TYPE_DC2_CHG = 4;
  DELTA3_PLUS_TIME_TASK_TYPE_DC_DSG = 5;
  DELTA3_PLUS_TIME_TASK_TYPE_OIL_ON = 6;
  DELTA3_PLUS_TIME_TASK_TYPE_OIL_OFF = 7;
  DELTA3_PLUS_TIME_TASK_TYPE_USB_CHG = 8;
  DELTA3_PLUS_TIME_TASK_TYPE_USB_DSG = 9;
}

enum Delta3PlusTimeTaskDetailType {
  DELTA3_PLUS_TIME_TASK_DETAIL_IDLE = 0;
  DELTA3_PLUS_TIME_TASK_DETAIL_POW = 1;
  DELTA3_PLUS_TIME_TASK_DETAIL_TEMP = 2;
  DELTA3_PLUS_TIME_TASK_DETAIL_LEVEL = 3;
}

message Delta3PlusTimeTaskParamDetail {
  optional Delta3PlusTimeTaskDetailType type = 1;
  optional float val = 2;
}

message Delta3PlusTimeTaskItemV2 {
  optional uint32 task_index = 1;
  optional bool is_cfg = 2;
  optional bool is_enable = 3;
  optional uint32 conflict_flag = 4;
  optional Delta3PlusTimeTaskMode time_mode = 5;
  optional uint32 time_param = 6;
  optional uint32 time_table = 7;
  optional Delta3PlusTimeTaskType task_type = 8;
  optional uint32 task_param = 9;
  repeated Delta3PlusTimeTaskParamDetail task_param_detail = 10;
}
