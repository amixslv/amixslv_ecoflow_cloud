syntax = "proto3";

message meterValue {
  oneof _Soc {
    uint32 time_stamp = 1;
    uint32 context = 2;
    uint32 current = 3;
    uint32 current_max = 4;
    uint32 voltage = 5;
    uint32 power_factor = 6;
    uint32 active_power = 7;
    uint32 reactive_power = 8;
    uint32 active_power_max = 9;
    uint32 frequency = 10;
    uint32 acitve_energy = 11;
    uint32 reacitve_energy = 12;
    uint32 acitve_energy_interval = 13;
    uint32 reacitve_energy_interval = 14;
    int32 temp = 15;
    uint32 Soc = 16;
  }
  oneof _RPM {
    uint32 RPM = 17;
  }
}

message vendorInfoSet {
  oneof _device_id {
    string device_id = 1;
  }
  oneof _url {
    string url = 2;
  }
  oneof _vendor {
    string vendor = 3;
  }
  oneof _cpo_name {
    string cpo_name = 4;
  }
  oneof _profile {
    uint32 profile = 5;
  }
  oneof _auth_key {
    string auth_key = 6;
  }
}

message vendorInfoSetAck {
  optional uint32 result = 1;
}

message vendorInfoGet {
  optional bool has_device_id = 1;
  optional bool has_url = 2;
  optional bool has_vendor = 3;
  optional bool has_cpo_name = 4;
  optional bool has_profile = 5;
}

message vendorInfoGetAck {
  oneof _device_id {
    string device_id = 1;
  }
  oneof _url {
    string url = 2;
  }
  oneof _vendor {
    string vendor = 3;
  }
  oneof _cpo_name {
    string cpo_name = 4;
  }
  oneof _profile {
    uint32 profile = 5;
  }
}

message vendorInfoClr {
}

message vendorInfoClrAck {
  optional uint32 result = 1;
}

message vendorCertSet {
}

message vendorCertSetAck {
  optional uint32 result = 1;
}

message configSet {
  oneof _unlock_ev_side_disconncet {
    uint32 unlock_ev_side_disconncet = 1;
  }
  oneof _led_flash_cnt {
    uint32 led_flash_cnt = 2;
  }
  oneof _led_flash_intensity {
    uint32 led_flash_intensity = 3;
  }
  oneof _invalid_id_charged_wh_limit {
    uint32 invalid_id_charged_wh_limit = 4;
  }
  oneof _meter_value_sync_period_from_0 {
    uint32 meter_value_sync_period_from_0 = 5;
  }
  oneof _meter_value_sync_period_charging {
    uint32 meter_value_sync_period_charging = 6;
  }
  oneof _phase_flip {
    uint32 phase_flip = 7;
  }
  oneof _avaliable_set {
    uint32 avaliable_set = 8;
  }
  oneof _gun_lock_ctrl {
    uint32 gun_lock_ctrl = 9;
  }
}

message configSetAck {
  oneof _unlock_ev_side_disconncet_ack {
    uint32 unlock_ev_side_disconncet_ack = 1;
  }
  oneof _led_flash_cnt_ack {
    uint32 led_flash_cnt_ack = 2;
  }
  oneof _led_flash_intensity_ack {
    uint32 led_flash_intensity_ack = 3;
  }
  oneof _invalid_id_charged_wh_limit_ack {
    uint32 invalid_id_charged_wh_limit_ack = 4;
  }
  oneof _meter_value_sync_period_from_0_ack {
    uint32 meter_value_sync_period_from_0_ack = 5;
  }
  oneof _meter_value_sync_period_charging_ack {
    uint32 meter_value_sync_period_charging_ack = 6;
  }
  oneof _phase_flip_ack {
    uint32 phase_flip_ack = 7;
  }
  oneof _avaliable_set_ack {
    uint32 avaliable_set_ack = 8;
  }
  oneof _gun_lock_ctrl_ack {
    uint32 gun_lock_ctrl_ack = 9;
  }
}

message configGet {
  optional uint32 has_unlock_ev_side_disconncet = 1;
  optional uint32 has_led_flash_cnt = 2;
  optional uint32 has_led_flash_intensity = 3;
  optional uint32 has_invalid_id_charged_wh_limit = 4;
  optional uint32 has_meter_value_sync_period_from_0 = 5;
  optional uint32 has_meter_value_sync_period_charging = 6;
  optional uint32 has_phase_flip = 7;
  optional uint32 has_avaliable_set = 8;
  optional uint32 has_gun_lock_ctrl = 9;
}

message configGetAck {
  oneof _unlock_ev_side_disconncet {
    uint32 unlock_ev_side_disconncet = 1;
  }
  oneof _led_flash_cnt {
    uint32 led_flash_cnt = 2;
  }
  oneof _led_flash_intensity {
    uint32 led_flash_intensity = 3;
  }
  oneof _invalid_id_charged_wh_limit {
    uint32 invalid_id_charged_wh_limit = 4;
  }
  oneof _meter_value_sync_period_from_0 {
    uint32 meter_value_sync_period_from_0 = 5;
  }
  oneof _meter_value_sync_period_charging {
    uint32 meter_value_sync_period_charging = 6;
  }
  oneof _phase_flip {
    uint32 phase_flip = 7;
  }
  oneof _avaliable_set {
    uint32 avaliable_set = 8;
  }
  oneof _gun_lock_ctrl {
    uint32 gun_lock_ctrl = 9;
  }
}

message systemReset {
  optional uint32 reset_type = 1;
}

message systemResetAck {
  optional uint32 result = 1;
}

message chargeCtrl {
  oneof _ctrl_type {
    uint32 charge_ctrl = 1;
    uint32 ctrl_type = 2;
  }
  oneof _order_id {
    uint32 order_id = 3;
  }
  oneof _card_id {
    string card_id = 4;
  }
  oneof _user_id {
    string user_id = 5;
  }
  oneof _current_ctrl {
    uint32 current_ctrl = 6;
  }
  oneof _phase_ctrl {
    uint32 phase_ctrl = 7;
  }
}

message chargeCtrlAck {
  oneof _stop_reason {
    uint32 result = 1;
    uint32 charge_ctrl = 2;
    uint32 meter = 3;
    .meterValue sample_value = 4;
    uint32 stop_reason = 5;
  }
  oneof _order_id {
    uint32 order_id = 6;
  }
  oneof _card_id {
    string card_id = 7;
  }
  oneof _user_id {
    string user_id = 8;
  }
}

message meterValueReport {
  oneof _sample_value {
    .meterValue sample_value = 1;
  }
}

message errorCodeReport {
  oneof _error_code {
    uint32 error_code = 1;
  }
}

message errorCodeReportAck {
  optional uint32 result = 1;
}

message chargerAppointment {
  oneof _order_id {
    uint32 is_appointment = 1;
    uint32 order_id = 2;
  }
  oneof _card_id {
    string card_id = 3;
  }
  oneof _user_id {
    string user_id = 4;
  }
  oneof _deadline_time_stamp {
    uint32 deadline_time_stamp = 5;
  }
  oneof _appointment_id {
    uint32 appointment_id = 6;
  }
}

message chargerAppointmentAck {
  oneof _appointment_id {
    uint32 is_appointment = 1;
    uint32 result = 2;
    uint32 appointment_id = 3;
  }
}

message chargingStateChangeReport {
  optional uint32 charge_ctrl = 1;
  optional uint32 ctrl_reason = 2;
  optional uint32 meter = 3;
  optional uint32 order_id = 4;
  optional string card_id = 5;
  optional string user_id = 6;
  optional .meterValue sample_value = 7;
}

message orderInfoSet {
  oneof _order_id {
    uint32 order_id = 1;
  }
  oneof _card_id {
    string card_id = 2;
  }
  oneof _user_id {
    string user_id = 3;
  }
  oneof _vehicle_id {
    string vehicle_id = 4;
  }
}

message orderInfoSetAck {
  optional uint32 result = 1;
}

message orderInfoGet {
  optional bool has_order_id = 1;
  optional bool has_card_id = 2;
  optional bool has_user_id = 3;
  optional bool has_vehicle_id = 4;
  optional bool has_start_type = 5;
  optional bool has_stop_reason = 6;
  optional bool has_start_time = 7;
  optional bool has_end_time = 8;
  optional bool has_charged_energy = 9;
  optional bool has_start_meter_energy = 10;
  optional bool has_end_meter_energy = 11;
  optional bool has_charging_time = 12;
}

message orderInfoGetAck {
  oneof _order_id {
    uint32 order_id = 1;
  }
  oneof _card_id {
    string card_id = 2;
  }
  oneof _user_id {
    string user_id = 3;
  }
  oneof _vehicle_id {
    string vehicle_id = 4;
  }
  oneof _start_type {
    uint32 start_type = 5;
  }
  oneof _stop_reason {
    uint32 stop_reason = 6;
  }
  oneof _start_time {
    fixed32 start_time = 7;
  }
  oneof _end_time {
    fixed32 end_time = 8;
  }
  oneof _charged_energy {
    uint32 charged_energy = 9;
  }
  oneof _start_meter_energy {
    uint32 start_meter_energy = 10;
  }
  oneof _end_meter_energy {
    uint32 end_meter_energy = 11;
  }
  oneof _charging_time {
    uint32 charging_time = 12;
  }
}

message dataTransferCP2CS {
  oneof _message {
    string message = 1;
  }
  oneof _data {
    string data = 2;
  }
}

message dataTransferCP2CSAck {
  oneof _data {
    uint32 status = 1;
    string data = 2;
  }
}

message dataTransferCS2CP {
  oneof _message {
    string message = 1;
  }
  oneof _data {
    string data = 2;
  }
}

message dataTransferCS2CPAck {
  oneof _data {
    uint32 status = 1;
    string data = 2;
  }
}

enum CmdID {
  NONE = 0;
  CONFIG_SET = 1;
  CONFIG_GET = 2;
  SYSTEM_RESET = 3;
  ERROR_REPORT = 4;
  METER_VALUE_REPORT = 5;
  CHARGE_CTRL = 6;
  CHARGE_APPOINTMENT = 7;
  CHARGING_STATE_CHANGE = 8;
  ORDER_INFO_SET = 9;
  ORDER_INFO_GET = 10;
  VENDOR_INFO_SET = 161;
  VENDOR_INFO_GET = 162;
  VENDOR_INFO_CLR = 163;
  VENDOR_CERT_SET = 164;
  DATA_TRANSFER_CP2CS = 241;
  DATA_TRANSFER_CS2CP = 242;
}

enum READING_CONTEXT {
  INT_BEGIN = 0;
  INT_END = 1;
  OTHER = 2;
  SAMPLE_CLOCK = 3;
  SAMPLE_PERIOD = 4;
  TRANS_BEGIN = 5;
  TRANS_END = 6;
  TRIGGER = 7;
}

enum ERROR_CODE {
  CONNECTOR_LOCK_FAILURE = 0;
  EV_COMMUNICATION_ERROR = 1;
  GROUND_FAILURE = 2;
  HIGH_TEMP = 3;
  INTER_ERROR = 4;
  LOCAL_LIST_CONFLICT = 5;
  NO_ERROR = 6;
  OTHER_ERROR = 7;
  OVER_CURRENT_FAILURE = 8;
  OVER_VOLT = 9;
  POWER_METER_FAILURE = 11;
  POWER_SWITCH_FAILURE = 12;
  READER_FAILURE = 13;
  RESET_FAILURE = 14;
  UNDER_VOLT = 15;
  WEAK_SIGNAL = 16;
}

